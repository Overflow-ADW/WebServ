server {
    listen 8080;
    server_name localhost;
    host 127.0.0.1;
    root ./www;
    index index.html;
    
    client_max_body_size 50;
    
    error_page 404 /404.html;
    error_page 500 /50x.html;
    
    location / {
        allowed_methods GET POST;
        autoindex off;
    }
    
    location /upload {
        allowed_methods POST;
        upload_path ./uploads;
    }
}
