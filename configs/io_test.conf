server {
    server_name localhost
    host 127.0.0.5
    root ./www
    index index.html
    client_max_body_size 1000000
    error_page 404 /404.html
    
    location / {
        allow_methods GET POST DELETE
        autoindex off
    }
  
    location /cgi-bin {
        allow_methods GET POST
        cgi_extension .sh
        cgi_path /bin/bash
    }
       # Route pour CGI
    location /cgi-bin {
        allowed_methods GET POST;
        cgi_extension .py .php .sh;
        cgi_path /usr/bin/python3;
    }
    
    location /upload {
        allow_methods PUT POST
        upload_path ./uploads
    }
}
