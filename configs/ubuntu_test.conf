# Configuration pour les tests Ubuntu
# Respecte exactement les exigences du testeur

server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 1000000;
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # / must answer to GET request ONLY
    location / {
        allowed_methods GET;
        autoindex off;
    }
    
    # /put_test/* must answer to PUT request and save files to a directory of your choice
    location /put_test {
        allowed_methods PUT;
        upload_path ./uploads;
    }
    
    # /post_body must answer anything to POST request with a maxBody of 100
    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }
    
    # /directory/ must answer to GET request and the root of it would be the repository YoupiBanane
    # if no file are requested, it should search for youpi.bad_extension files
    location /directory {
        allowed_methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex on;
    }
    
    # any file with .bla as extension must answer to POST request by calling the cgi_test executable
    location ~ \.bla$ {
        allowed_methods POST;
        cgi_extension .bla;
        cgi_path ./cgi_test;
    }
}
