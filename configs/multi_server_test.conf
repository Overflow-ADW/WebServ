# Configuration multi-serveurs pour tests d'évaluation
# Serveur 1 - Port 8080
server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 1000000;
    
    error_page 404 /404.html;
    
    location / {
        allowed_methods GET POST DELETE;
        autoindex off;
    }
    
    location /upload {
        allowed_methods PUT POST;
        upload_path ./uploads;
    }
}

# Serveur 2 - Port 8081
server {
    listen 8081;
    server_name example.com;
    root ./www2;
    index index.html;
    client_max_body_size 500000;
    
    error_page 404 /404.html;
    
    location / {
        allowed_methods GET;
        autoindex on;
    }
}

# Serveur 3 - Port 8082
server {
    listen 8082;
    server_name test.local;
    root ./www;
    index index.html;
    client_max_body_size 2000000;
    
    location / {
        allowed_methods GET POST;
        autoindex off;
    }
    
    location /redirect {
        allowed_methods GET;
        return 301 https://www.google.com;
    }
}
