# Configuration pour tester les limites de body
server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 100;  # Très petit pour les tests
    
    location / {
        allowed_methods GET POST;
    }
    
    location /large_body {
        allowed_methods POST;
        client_max_body_size 50;  # Encore plus petit
    }
}
