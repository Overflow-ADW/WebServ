# Configuration par défaut pour Webserv
# Syntaxe inspirée de Nginx

server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html index.htm;
    
    # Taille maximale du body des requêtes (en bytes)
    client_max_body_size 1000000;
    
    # Pages d'erreur personnalisées
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Route par défaut
    location / {
        allowed_methods GET;
        autoindex off;
    }
    
    # Route pour les uploads
    location /upload {
        allowed_methods GET POST;
        upload_path ./uploads;
    }
    
    # Route pour CGI
    location /cgi-bin {
        allowed_methods GET POST;
        cgi_extension .py .php;
        cgi_path /usr/bin/python3;
    }
    
    # Redirection
    location /redirect {
        allowed_methods GET POST;
        return 301 https://www.google.com;
    }
}

# Deuxième serveur virtuel (exemple)
server {
    listen 8081;
    server_name example.com;
    root ./www_example;
    index index.html;
    
    location / {
        allowed_methods GET;
        autoindex on;
    }
}
