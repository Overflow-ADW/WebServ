<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page non trouvée</title>
    <link rel="stylesheet" href="style404.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Space+Grotesk:wght@300;400;500;700;900&display=swap");
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">ERROR_PAGE_NOT_FOUND</h2>
        <p class="error-message">REQUESTED_RESOURCE_NOT_FOUND_ON_SERVER</p>
        <a href="/" class="back-button">← RETURN_TO_HOME</a>
      </div>
    </div>
  </body>
</html>
